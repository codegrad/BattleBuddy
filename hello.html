<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello from Builder</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.75rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #eef4fb;
    color: #1c2a3a;
  }

  h1 {
    margin: 0;
    text-align: center;
    font-size: clamp(2rem, 8vw, 4.5rem);
    font-weight: 650;
    letter-spacing: -0.02em;
    line-height: 1.1;
  }

  button {
    font: inherit;
    font-size: 1.15rem;
    padding: 0.7rem 1.6rem;
    border: 1px solid #c7d8ec;
    border-radius: 999px;
    background: #ffffff;
    color: #1c2a3a;
    cursor: pointer;
    box-shadow: 0 1px 3px rgba(28, 42, 58, 0.08);
    transition: background 0.15s ease, transform 0.15s ease;
  }

  button:hover {
    background: #dceaf9;
  }

  button:active {
    transform: translateY(1px);
  }

  button:focus-visible {
    outline: 2px solid #4a86c8;
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <h1>Hello from Builder</h1>
  <button id="wave" type="button">Wave 👋</button>
<script>
  document.getElementById('wave').addEventListener('click', function () {
    alert('Hi!');
  });
</script>
</body>
</html>
