<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello from Builder</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #ffffff;
    color: #111111;
  }
  h1 {
    font-size: clamp(2rem, 8vw, 5rem);
    margin: 0;
    text-align: center;
  }
  button {
    font: inherit;
    font-size: 1.25rem;
    padding: 0.6rem 1.4rem;
    border: 1px solid #111111;
    border-radius: 8px;
    background: #ffffff;
    color: #111111;
    cursor: pointer;
  }
  button:hover {
    background: #111111;
    color: #ffffff;
  }
</style>
</head>
<body>
  <h1>Hello from Builder</h1>
  <button id="wave" type="button">Wave 👋</button>
<script>
  document.getElementById('wave').addEventListener('click', function () {
    alert('Hi!');
  });
</script>
</body>
</html>
